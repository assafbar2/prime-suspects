    <style>
      /* Styles the pre-hydration fallback in #root. Inline so it applies before
         the app's stylesheet arrives; React discards the markup on first paint. */
      .boot-fallback {
        /* Paints its own ground rather than styling body, so nothing here can
           outlive the fallback and fight the app's stylesheet after mount. */
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1rem;
        box-sizing: border-box;
        overflow: auto;
        margin: 0;
        padding: 2rem 1.25rem;
        background: linear-gradient(160deg, #0b3d2e, #06251c);
        color: #f6efe0;
        font: 17px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .boot-fallback > * {
        max-width: 34rem;
        margin-left: auto;
        margin-right: auto;
      }
      .boot-fallback h1 {
        font-family: 'Cinzel', Georgia, serif;
        font-size: clamp(1.75rem, 7vw, 2.5rem);
        letter-spacing: 0.04em;
        color: #d4af37;
        margin: 0;
        text-transform: uppercase;
      }
      .boot-fallback p {
        margin: 0;
      }
      .boot-fallback .boot-links {
        margin-top: 1rem;
        font-size: 0.95rem;
      }
      .boot-fallback a {
        color: #d4af37;
      }
    </style>

  </head>
  <body>
    <!--
      The markup inside #root is a pre-hydration fallback. createRoot().render()
      clears the container on first paint, so this is what a reader sees only
      while the bundle loads — and what a crawler with JavaScript off sees at
      all. Before this existed, both got an empty div.
    -->
    <div id="root">
      <main class="boot-fallback">
        <h1>Prime Suspects</h1>
        <p class="boot-status" role="status">Opening the case…</p>
        <noscript>
          <style>.boot-status { display: none; }</style>
          <p>Enable JavaScript to play Prime Suspects.</p>
          <p class="boot-links">
            <a href="./about/">About the game</a> · <a href="./privacy/">Privacy</a>
          </p>
        </noscript>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
